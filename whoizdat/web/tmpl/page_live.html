{{define "main"}}
<h1>Live</h1>
<form action="/" method="get" fx-action="/devices" fx-target="#devices" fx-trigger="change" role="search">
  <fieldset>
    <legend>Filter</legend>
    <label>Radio
      <select name="kind">
        <option value="">All</option>
        <option value="wifi"{{if eq .F.Kind "wifi"}} selected{{end}}>Wi-Fi</option>
        <option value="ble"{{if eq .F.Kind "ble"}} selected{{end}}>Bluetooth</option>
      </select></label>
    <label>Type
      <select name="role">
        <option value="">All</option>
        <option value="ap"{{if eq .F.Role "ap"}} selected{{end}}>Access points</option>
        <option value="client"{{if eq .F.Role "client"}} selected{{end}}>Wi-Fi clients</option>
      </select></label>
    <label>Heard in
      <select name="within">
        {{range $v := (list "1m" "10m" "1h" "24h" "all")}}<option{{if eq $v $.Within}} selected{{end}}>{{$v}}</option>{{end}}
      </select></label>
    <label>Signal at least
      <select name="rssi">
        <option value="">Any</option>
        {{range $v := (list "-50" "-60" "-70" "-80")}}<option value="{{$v}}"{{if eq (printf "%d" $.F.MinRSSI) $v}} selected{{end}}>{{$v}} dBm</option>{{end}}
      </select></label>
    <label>Sort
      <select name="sort">
        <option value="">Last heard</option>
        <option value="rssi"{{if eq .F.Sort "rssi"}} selected{{end}}>Signal</option>
        <option value="first"{{if eq .F.Sort "first"}} selected{{end}}>First heard</option>
        <option value="count"{{if eq .F.Sort "count"}} selected{{end}}>Frames</option>
      </select></label>
    <label><input type="checkbox" name="new" value="1"{{if .F.NewOnly}} checked{{end}}> New only</label>
    <label><input type="checkbox" name="sig" value="1"{{if .F.SigOnly}} checked{{end}}> Signature match only</label>
    <label>Search <input type="search" name="q" value="{{.F.Query}}" placeholder="Name, address, signature"></label>
    <button type="submit">Apply</button>
  </fieldset>
</form>
{{template "devices" .}}
{{end}}
